[package]
name = "DeployerApp"
version = "0.1.0"
description = "DeployerApp una aplicación para el desplieque de sitios web, manteniendo el control de los datos en una BD localmente - by IDMarinas"
authors = ["IDMarinas"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deployer_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
serde_json = "1.0.151"

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-positioner = { version = "2.3.3", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
tokio = { version = "1.53.1", features = ["time"] }
tokio-util = "0.7"
ts-rs = "12.0.1"
russh = "0.62.6"
russh-sftp = "2.3.0"
chrono = { version = "0.4.45", features = ["serde"] }
aes-gcm = "0.11.0"
keyring = "4.1.6"
base64 = "0.23.1"
rand = { version = "0.10.2", default-features = false, features = ["sys_rng"] }
rand_core = { version = "0.10.1" }
hex = "0.4.3"
deployer-macros = { path = "crates/deployer-macros" }
reqwest = { version = "0.12.28", features = ["json", "rustls-tls"], default-features = false }
urlencoding = "2.1.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-positioner = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
