<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeployerApp</title>

  <style id="style-splashscreen">
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #0ea5e9;
      --primary-dim: rgba(14, 165, 233, 0.15);
      --primary-gradient-start: #00f2fe;
      --primary-gradient-end: #8b5cf6;
      --bg: #ffffff;
      --bg-card: #ffffff;
      --border: #e4e4e7;
      --text: #18181b;
      --text-muted: #71717a;
      --blue-dim: rgba(0, 242, 254, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --primary-dim: rgba(14, 165, 233, 0.20);
        --blue-dim: rgba(0, 242, 254, 0.15);
        --bg: #09090b;
        --bg-card: #18181b;
        --border: #27272a;
        --text: #fafafa;
        --text-muted: #71717a;
      }
    }

    html,
    body,
    #app {
      height: 100%;
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: opacity 0.4s ease;
    }

    body.fade-out {
      opacity: 0;
    }

    /* ── Fondo decorativo ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      animation: pulse-blob 4s ease-in-out infinite;
    }

    .blob-tl {
      top: -10%;
      left: -10%;
      width: 50%;
      height: 50%;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.18), rgba(14, 165, 233, 0.18));
    }

    .blob-br {
      bottom: -10%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(14, 165, 233, 0.15));
      animation-delay: 2s;
    }

    /* ── Layout central ── */
    .center {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 1.5rem;
    }

    /* ── Icono ── */
    .icon-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-ping {
      position: absolute;
      inset: 0;
      transform: scale(1.5);
      border-radius: 50%;
      background: var(--primary-dim);
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
      opacity: 0.25;
    }

    .icon-card {
      position: relative;
      background: var(--bg-card);
      padding: 1.25rem;
      border-radius: 1.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .25);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-img {
      width: 4.5rem;
      height: 4.5rem;
      object-fit: contain;
      /* CAMBIA LA ANIMACIÓN AQUÍ PARA PROBAR LAS DIFERENTES OPCIONES: */
      /* Opción A (Escalado y pulso sutil) */
      animation: pulse-logo 2.5s ease-in-out infinite;
      /* Opción B (Flotación de despegue con inclinación) */
      /* animation: float-launch 2.5s ease-in-out infinite; */
      /* Opción C (Flotación vertical simple) */
      /* animation: float 2s ease-in-out infinite; */
      /* Opción D (Recomendado: Resplandor pausado, sin movimiento) */
      /* animation: breathing-glow 3s ease-in-out infinite; */
    }

    /* ── Textos ── */
    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
      max-width: 24rem;
      text-align: center;
    }

    .app-title {
      font-size: 2.5rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--text);
      line-height: 3.5rem;
      background: linear-gradient(135deg, var(--text) 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (prefers-color-scheme: dark) {
      .app-title {
        background: linear-gradient(135deg, var(--text) 40%, var(--primary) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    .app-subtitle {
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-top: .5rem;
    }

    /* ── Barra de progreso ── */
    .progress-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--primary-gradient-start) 0%, var(--primary) 50%, var(--primary-gradient-end) 100%);
      animation: carousel 1.8s ease-in-out infinite;
      transform-origin: left;
    }

    .loading-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 1rem;
      height: 1rem;
      border: 2px solid var(--border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
    }

    /* ── Botón de recarga tardía ── */
    .reload-btn {
      margin-top: .25rem;
      padding: .5rem 1.25rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: .8rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .2s, color .2s, border-color .2s;
      animation: fadeIn .5s ease both;
    }

    .reload-btn:hover {
      background: var(--primary-dim);
      border-color: var(--primary);
      color: var(--text);
    }

    @media (prefers-color-scheme: dark) {
      .icon-card {
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, .5);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Animaciones ── */
    @keyframes pulse-blob {

      0%,
      100% {
        opacity: 0.8;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.05);
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-6px) scale(1.03);
      }
    }

    /* Opción A: Pulsación y escalado sutil */
    @keyframes pulse-logo {

      0%,
      100% {
        transform: scale(1);
        filter: drop-shadow(0 4px 6px rgba(14, 165, 233, 0.1));
      }

      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 12px 20px rgba(14, 165, 233, 0.35));
      }
    }

    /* Opción B: Flotación de despegue con inclinación */
    @keyframes float-launch {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg) scale(1);
      }

      50% {
        transform: translateY(-8px) rotate(2deg) scale(1.02);
      }
    }

    /* Opción D: Resplandor pausado (estático pero con brillo) */
    @keyframes breathing-glow {

      0%,
      100% {
        filter: drop-shadow(0 4px 10px rgba(14, 165, 233, 0.1));
      }

      50% {
        filter: drop-shadow(0 12px 24px rgba(14, 165, 233, 0.45));
      }
    }

    @keyframes ping {

      75%,
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes carousel {
      0% {
        transform: translateX(-100%) scaleX(.4);
      }

      50% {
        transform: translateX(60%) scaleX(.6);
      }

      100% {
        transform: translateX(200%) scaleX(.4);
      }
    }
  </style>
</head>

<body>
  <div id="app" class="isolate">
    <!-- Fondos decorativos -->
    <div class="blob blob-tl"></div>
    <div class="blob blob-br"></div>

    <div class="center">
      <!-- Icono central con efecto ping -->
      <div class="icon-wrap">
        <div class="icon-ping"></div>
        <div class="icon-card">
          <img class="icon-img" src="/logo.png" alt="DeployerApp Logo" />
        </div>
      </div>

      <!-- Textos + progreso -->
      <div class="text-block">
        <div>
          <h2 class="app-title" id="title">DeployerApp</h2>
          <p class="app-subtitle" id="subtitle"></p>
        </div>

        <div class="progress-wrap">
          <div class="progress-track">
            <div class="progress-bar"></div>
          </div>
          <div class="loading-label">
            <div class="spinner"></div>
            <span class="loading-text" id="loading-text"></span>
          </div>
        </div>

        <button id="reload-btn" class="reload-btn" onclick="location.reload()" hidden></button>
      </div>
    </div>

    <script>
      const messages = {
        es: {
          subtitle: 'Preparando el entorno de despliegue',
          loading_text: 'Cargando recursos…',
          slow_reload: '¿Tarda demasiado? Prueba a recargar la página'
        },
        en: {
          subtitle: 'Preparing the deployment environment',
          loading_text: 'Loading resources…',
          slow_reload: 'Taking too long? Try reloading the page'
        },
      }

      function getUserLanguage() {
        return navigator.language.split('-')[0]; // "es-ES" → "es"
      }

      function updateMessage() {
        const lang = getUserLanguage();
        const texts = (messages[lang] || messages['es']);

        document.documentElement.setAttribute('lang', lang)

        document.getElementById('subtitle').textContent = texts.subtitle;
        document.getElementById('loading-text').textContent = texts.loading_text;
        const reloadBtn = document.getElementById('reload-btn');
        if (reloadBtn) reloadBtn.textContent = texts.slow_reload;
      }

      // Mostrar botón si la carga tarda más de 10 segundos
      setTimeout(() => {
        const btn = document.getElementById('reload-btn');
        if (btn) btn.hidden = false;
      }, 10000);

      let currentLang = navigator.language;
      window.addEventListener('focus', () => {
        const newLang = navigator.language;
        if (newLang !== currentLang) {
          currentLang = newLang;
          updateMessage();
        }
      });

      updateMessage();
    </script>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
