<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/logo.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#ffffff" />
		<title>DeployerApp</title>

		<style id="style-splashscreen">
			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			:root,
			.light {
				--primary: #0a8dff;
				--primary-dim: rgba(10, 141, 255, 0.15);
				--primary-gradient-start: #00c7ff;
				--primary-gradient-end: #821aff;
				--primary-glow: rgba(10, 141, 255, 0.5);
				--bg: #f2f4f7;
				--bg-card: #ffffff;
				--bg-accented: #bfc6cf;
				--border: #a5aebc;
				--text: #15181b;
				--text-muted: #717f94;
				--blue-dim: rgba(0, 199, 255, 0.1);
			}

			@media (prefers-color-scheme: dark) {
				:root {
					--primary-dim: rgba(10, 141, 255, 0.2);
					--blue-dim: rgba(0, 199, 255, 0.15);
					--bg: #0b0c0e;
					--bg-card: #15181b;
					--bg-accented: #2b3136;
					--border: #2b3136;
					--text: #d9dde3;
					--text-muted: #717f94;
				}
			}

			.dark {
				--primary-dim: rgba(10, 141, 255, 0.2);
				--blue-dim: rgba(0, 199, 255, 0.15);
				--bg: #0b0c0e;
				--bg-card: #15181b;
				--bg-accented: #2b3136;
				--border: #2b3136;
				--text: #d9dde3;
				--text-muted: #717f94;
			}

			html,
			body,
			#app {
				height: 100%;
				background: var(--bg);
				font-family:
					ui-sans-serif,
					system-ui,
					-apple-system,
					sans-serif;
				-webkit-font-smoothing: antialiased;
				overflow: hidden;
				transition: opacity 0.4s ease;
			}

			body.fade-out {
				opacity: 0;
			}

			/* ── Fondo decorativo ── */
			.blob {
				position: fixed;
				border-radius: 50%;
				filter: blur(120px);
				pointer-events: none;
				animation: pulse-blob 4s ease-in-out infinite;
			}

			.blob-tl {
				top: -10%;
				left: -10%;
				width: 50%;
				height: 50%;
				background: linear-gradient(135deg, rgba(0, 199, 255, 0.18), rgba(10, 141, 255, 0.18));
			}

			.blob-br {
				bottom: -10%;
				right: -10%;
				width: 50%;
				height: 50%;
				background: linear-gradient(135deg, rgba(130, 26, 255, 0.15), rgba(10, 141, 255, 0.15));
				animation-delay: 2s;
			}

			/* ── Layout central ── */
			.center {
				position: relative;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 2.5rem;
				padding: 1.5rem;
			}

			/* ── Icono ── */
			.icon-wrap {
				position: relative;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.icon-ping {
				position: absolute;
				inset: 0;
				transform: scale(1.5);
				border-radius: 50%;
				background: var(--primary-dim);
				animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
				opacity: 0.25;
			}

			.icon-card {
				position: relative;
				background: var(--bg-card);
				padding: 1.25rem;
				border: 1px solid var(--border);
				display: flex;
				align-items: center;
				justify-content: center;
				clip-path: polygon(
					10px 0%,
					calc(100% - 10px) 0%,
					100% 10px,
					100% calc(100% - 10px),
					calc(100% - 10px) 100%,
					10px 100%,
					0% calc(100% - 10px),
					0% 10px
				);
				filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.18));
			}

			.icon-card::before,
			.icon-card::after {
				content: '';
				position: absolute;
				width: 6px;
				height: 6px;
				border-radius: 50%;
				background: var(--primary);
				box-shadow: 0 0 4px var(--primary-dim);
				z-index: 1;
			}
			.icon-card::before {
				top: 12px;
				left: 12px;
			}
			.icon-card::after {
				bottom: 12px;
				right: 12px;
			}

			.icon-img {
				width: 4.5rem;
				height: 4.5rem;
				object-fit: contain;
				/* CAMBIA LA ANIMACIÓN AQUÍ PARA PROBAR LAS DIFERENTES OPCIONES: */
				/* Opción A (Escalado y pulso sutil) */
				animation: pulse-logo 2.5s ease-in-out infinite;
				/* Opción B (Flotación de despegue con inclinación) */
				/* animation: float-launch 2.5s ease-in-out infinite; */
				/* Opción C (Flotación vertical simple) */
				/* animation: float 2s ease-in-out infinite; */
				/* Opción D (Recomendado: Resplandor pausado, sin movimiento) */
				/* animation: breathing-glow 3s ease-in-out infinite; */
			}

			/* ── Textos ── */
			.text-block {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.5rem;
				width: 100%;
				max-width: 24rem;
				text-align: center;
			}

			.app-title {
				font-size: 2.5rem;
				font-weight: 900;
				letter-spacing: -0.04em;
				color: var(--text);
				line-height: 3.5rem;
				background: linear-gradient(135deg, var(--text) 30%, var(--primary) 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			@media (prefers-color-scheme: dark) {
				.app-title {
					background: linear-gradient(135deg, var(--text) 40%, var(--primary) 100%);
					-webkit-background-clip: text;
					background-clip: text;
					-webkit-text-fill-color: transparent;
				}
			}

			.dark .app-title {
				background: linear-gradient(135deg, var(--text) 40%, var(--primary) 100%);
				-webkit-background-clip: text;
				background-clip: text;
				-webkit-text-fill-color: transparent;
			}

			.app-subtitle {
				color: var(--text-muted);
				font-weight: 500;
				letter-spacing: -0.02em;
				margin-top: 0.5rem;
			}

			/* ── Barra de progreso ── */
			.progress-wrap {
				width: 100%;
				display: flex;
				flex-direction: column;
				gap: 0.75rem;
			}

			.progress-track {
				width: 100%;
				height: 8px;
				background: var(--bg-accented);
				border-radius: 9999px;
				overflow: hidden;
				box-shadow: inset 0 0 0 1px var(--border);
			}

			.progress-bar {
				position: relative;
				height: 100%;
				border-radius: 9999px;
				overflow: hidden;
				background: linear-gradient(90deg, var(--primary) 0%, var(--primary-gradient-end) 50%, var(--primary) 100%);
				box-shadow: 0 0 12px var(--primary-glow);
				animation: carousel 1.8s ease-in-out infinite;
				transform-origin: left;
			}

			.progress-bar::after {
				content: '';
				position: absolute;
				inset: 0;
				border-radius: 9999px;
				background: linear-gradient(to right, transparent 0%, rgba(255, 255, 255, 0.25) 50%, transparent 100%);
			}

			.loading-label {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				color: var(--text-muted);
			}

			.spinner {
				width: 1rem;
				height: 1rem;
				border: 2px solid var(--border);
				border-top-color: var(--text-muted);
				border-radius: 50%;
				animation: spin 1s linear infinite;
			}

			.loading-text {
				font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
				font-size: 0.75rem;
				font-weight: 700;
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}

			/* ── Botón de recarga tardía (estilo PCB) ── */
			.reload-btn {
				margin-top: 0.25rem;
				padding: 0.5rem 1.25rem;
				border: 1px solid var(--border);
				background: transparent;
				color: var(--text-muted);
				font-family: 'JetBrains Mono', ui-monospace, 'Cascadia Code', monospace;
				font-size: 0.8rem;
				font-weight: 600;
				cursor: pointer;
				clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
				transition:
					background 0.2s,
					color 0.2s,
					border-color 0.2s,
					filter 0.2s;
				animation: fadeIn 0.5s ease both;
				letter-spacing: 0.04em;
			}

			.reload-btn:hover {
				background: var(--primary-dim);
				border-color: var(--primary);
				color: var(--text);
				filter: drop-shadow(0 0 8px var(--primary-glow));
			}

			@media (prefers-color-scheme: dark) {
				.icon-card {
					filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45));
				}
			}

			.dark .icon-card {
				filter: drop-shadow(0 2px 10px rgba(0, 0, 0, 0.45));
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(4px);
				}

				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			/* ── Animaciones ── */
			@keyframes pulse-blob {
				0%,
				100% {
					opacity: 0.8;
					transform: scale(1);
				}

				50% {
					opacity: 0.5;
					transform: scale(1.05);
				}
			}

			@keyframes float {
				0%,
				100% {
					transform: translateY(0px) scale(1);
				}

				50% {
					transform: translateY(-6px) scale(1.03);
				}
			}

			/* Opción A: Pulsación y escalado sutil */
			@keyframes pulse-logo {
				0%,
				100% {
					transform: scale(1);
					filter: drop-shadow(0 4px 6px rgba(10, 141, 255, 0.1));
				}

				50% {
					transform: scale(1.05);
					filter: drop-shadow(0 12px 20px rgba(10, 141, 255, 0.35));
				}
			}

			/* Opción B: Flotación de despegue con inclinación */
			@keyframes float-launch {
				0%,
				100% {
					transform: translateY(0px) rotate(0deg) scale(1);
				}

				50% {
					transform: translateY(-8px) rotate(2deg) scale(1.02);
				}
			}

			/* Opción D: Resplandor pausado (estático pero con brillo) */
			@keyframes breathing-glow {
				0%,
				100% {
					filter: drop-shadow(0 4px 10px rgba(10, 141, 255, 0.1));
				}

				50% {
					filter: drop-shadow(0 12px 24px rgba(10, 141, 255, 0.45));
				}
			}

			@keyframes ping {
				75%,
				100% {
					transform: scale(2);
					opacity: 0;
				}
			}

			@keyframes spin {
				to {
					transform: rotate(360deg);
				}
			}

			@keyframes carousel {
				0% {
					transform: translateX(-100%) scaleX(0.4);
				}

				50% {
					transform: translateX(60%) scaleX(0.6);
				}

				100% {
					transform: translateX(200%) scaleX(0.4);
				}
			}
		</style>

		<script>
			// ─── Tema claro/oscuro: BD → localStorage → sistema ───
			;(function () {
				var theme = 'auto'

				// 1. Intento rápido desde localStorage (síncrono, sin flash)
				try {
					var stored = localStorage.getItem('vueuse-color-scheme')
					if (stored) theme = stored
				} catch (_) {}

				function resolve(t) {
					if (t === 'light' || t === 'dark') return t
					return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
				}

				function apply(t) {
					document.documentElement.classList.toggle('dark', t === 'dark')
					document.documentElement.classList.toggle('light', t === 'light')
					var meta = document.querySelector('meta[name="theme-color"]')
					if (meta) meta.content = t === 'dark' ? '#09090b' : '#ffffff'
				}

				apply(resolve(theme))

				// 2. Async: consultar BD (más autoritativo)
				if (window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke) {
					window.__TAURI_INTERNALS__
						.invoke('get_deployer_setting', { key: 'theme_color' })
						.then(function (r) {
							if (r && r.success && r.data && r.data.value) {
								apply(resolve(r.data.value))
							}
						})
						.catch(function () {})
				}
			})()
		</script>
	</head>

	<body>
		<div id="app" class="isolate">
			<!-- Fondos decorativos -->
			<div class="blob blob-tl"></div>
			<div class="blob blob-br"></div>

			<div class="center">
				<!-- Icono central con efecto ping -->
				<div class="icon-wrap">
					<div class="icon-ping"></div>
					<div class="icon-card">
						<img class="icon-img" src="/logo.png" alt="DeployerApp Logo" />
					</div>
				</div>

				<!-- Textos + progreso -->
				<div class="text-block">
					<div>
						<h2 class="app-title" id="title">DeployerApp</h2>
						<p class="app-subtitle" id="subtitle"></p>
					</div>

					<div class="progress-wrap">
						<div class="progress-track">
							<div class="progress-bar"></div>
						</div>
						<div class="loading-label">
							<div class="spinner"></div>
							<span class="loading-text" id="loading-text"></span>
						</div>
					</div>

					<button id="reload-btn" class="reload-btn" onclick="location.reload()" hidden></button>
				</div>
			</div>

			<script>
				const messages = {
					es: {
						subtitle: 'Preparando el entorno de despliegue',
						loading_text: 'Cargando recursos…',
						slow_reload: '¿Tarda demasiado? Prueba a recargar la página',
					},
					en: {
						subtitle: 'Preparing the deployment environment',
						loading_text: 'Loading resources…',
						slow_reload: 'Taking too long? Try reloading the page',
					},
				}

				function getUserLanguage() {
					return navigator.language.split('-')[0] // "es-ES" → "es"
				}

				function updateMessage() {
					const lang = getUserLanguage()
					const texts = messages[lang] || messages['es']

					document.documentElement.setAttribute('lang', lang)

					document.getElementById('subtitle').textContent = texts.subtitle
					document.getElementById('loading-text').textContent = texts.loading_text
					const reloadBtn = document.getElementById('reload-btn')
					if (reloadBtn) reloadBtn.textContent = texts.slow_reload
				}

				// Mostrar botón si la carga tarda más de 10 segundos
				setTimeout(() => {
					const btn = document.getElementById('reload-btn')
					if (btn) btn.hidden = false
				}, 10000)

				let currentLang = navigator.language
				window.addEventListener('focus', () => {
					const newLang = navigator.language
					if (newLang !== currentLang) {
						currentLang = newLang
						updateMessage()
					}
				})

				updateMessage()
			</script>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
